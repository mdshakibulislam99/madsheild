<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan Report — MadSheild</title>
  <meta name="description" content="Full evidence-backed MadSheild analysis report for a single scanned file.">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="stylesheet" href="assets/css/history.css">
</head>
<body>

  <div id="shared-header"></div>

  <main>
    <!-- ============ PAGE HEADER ============ -->
    <section class="history-hero report-hero">
      <div class="history-hero-inner">
        <span class="section-eyebrow">Scan report</span>
        <h1 class="section-title" id="reportPageTitle">Loading report…</h1>
        <p class="section-sub" id="reportPageSummary">Fetching the saved analysis for this scan.</p>
      </div>
    </section>

    <!-- ============ REPORT CONTENT ============ -->
    <section class="history-wrap">
      <!-- Error state -->
      <div id="reportPageError" class="history-error report-page-error" hidden>
        <p id="reportPageErrorMessage" role="alert"></p>
        <div class="toolbar-actions">
          <a href="/history.html" class="btn btn-text toolbar-btn">Back to history</a>
          <a href="/scan.html" class="btn btn-primary toolbar-btn">New scan</a>
        </div>
      </div>

      <!-- Report body -->
      <div id="reportPageBody" hidden>
        <div class="report-toolbar">
          <a href="/history.html" class="btn btn-text toolbar-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path>
            </svg>
            Back to history
          </a>
          <div class="toolbar-actions">
            <a id="reportJsonLink" class="btn btn-text toolbar-btn" target="_blank" rel="noopener">Open raw JSON</a>
            <a href="/scan.html" class="btn btn-primary toolbar-btn">New scan</a>
          </div>
        </div>

        <div class="report-card report-card-page">
          <div class="report-body" id="reportPageContent"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="home-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <img src="assets/images/logo_2.png" alt="MadSheild logo">
        <span>MadSheild</span>
      </div>
      <nav class="footer-links" aria-label="Footer">
        <a href="/">Home</a>
        <a href="/scan.html">Scan</a>
        <a href="/history.html">History</a>
        <a href="/#features">Features</a>
      </nav>
      <p class="footer-copy">© 2026 MadSheild · AI-powered document static analysis · Reports describe indicators, not guarantees.</p>
    </div>
  </footer>

  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/report.js"></script>
  <script src="assets/js/header-loader.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
