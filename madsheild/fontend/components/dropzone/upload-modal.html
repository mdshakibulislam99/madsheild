<div class="upload-card">
  <div class="upload-header">
    <h2>Upload file</h2>
    <button class="close-btn">&times;</button>
  </div>

  <p class="upload-subtext">Add your file or document here</p>

  <!-- Drag & Drop Dashed Box Area -->
  <div class="drop-zone">
    <div class="folder-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        <line x1="12" y1="11" x2="12" y2="17"></line>
        <polyline points="9 14 12 11 15 14"></polyline>
      </svg>
    </div>
    <p class="drop-text">Drop your file here, <a href="#" class="browse-link">or click to browse</a></p>
  </div>

  <p class="supported-files">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 4px;">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="16" x2="12" y2="12"></line>
      <line x1="12" y1="8" x2="12.01" y2="8"></line>
    </svg>
    Supported files: .txt and .docx (maximum 10 MB per file)
  </p>

  <button class="btn btn-continue" disabled>Continue</button>
</div>
